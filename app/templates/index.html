<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Healthcare LLM Firewall</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; color: #182230; background: #f3f6fa; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(900px, calc(100% - 32px)); margin: 42px auto; }
    h1 { margin-bottom: 4px; font-size: clamp(1.7rem, 4vw, 2.3rem); }
    .subtle { color: #526173; }
    .notice { padding: 12px 16px; border-left: 4px solid #d08b19; background: #fff8e8; border-radius: 6px; }
    form, .result { margin-top: 22px; padding: 22px; background: white; border: 1px solid #dce3eb; border-radius: 10px; box-shadow: 0 5px 18px #1a36500a; }
    label { display: block; margin: 15px 0 6px; font-weight: 650; }
    textarea, select { width: 100%; padding: 11px 12px; border: 1px solid #b8c4d2; border-radius: 6px; font: inherit; }
    textarea { min-height: 105px; resize: vertical; }
    #contexts { min-height: 78px; }
    button { margin-top: 18px; padding: 10px 18px; border: 0; border-radius: 6px; color: white; background: #155eef; font: inherit; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    .result h2 { margin-top: 0; }
    pre { overflow-x: auto; padding: 15px; background: #101828; color: #e6edf6; border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Healthcare LLM Firewall</h1>
    <form id="evaluate-form">
      <label for="query">Question</label>
      <textarea id="query" required maxlength="5000">What are common symptoms of dehydration, and when should someone seek medical help?</textarea>

      <label for="contexts">Untrusted context (optional; one passage per line)</label>
      <textarea id="contexts">Dehydration can cause thirst, dark urine, dizziness, and reduced urination. Severe symptoms may require urgent medical attention.</textarea>

      <label for="configuration">Firewall configuration</label>
      <select id="configuration">
        <option value="A">A — no guards</option>
        <option value="B">B — input guard</option>
        <option value="C">C — output validator</option>
        <option value="D" selected>D — input guard + output validator</option>
      </select>

      <button id="submit" type="submit">Evaluate</button>
      <span id="progress" class="subtle" role="status"></span>
    </form>

    <section id="result" class="result hidden" aria-live="polite">
      <h2>Evaluation result</h2>
      <pre id="result-json"></pre>
    </section>
  </main>
  <script>
    const form = document.getElementById('evaluate-form');
    const button = document.getElementById('submit');
    const progress = document.getElementById('progress');
    const result = document.getElementById('result');
    const resultJson = document.getElementById('result-json');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      progress.textContent = 'Running the configured model and firewall…';
      result.classList.remove('hidden');
      resultJson.textContent = 'Waiting for /evaluate…';
      const contexts = document.getElementById('contexts').value
        .split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
      try {
        const response = await fetch('/evaluate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            query: document.getElementById('query').value,
            contexts,
            configuration: document.getElementById('configuration').value,
          }),
        });
        const data = await response.json();
        resultJson.textContent = JSON.stringify(data, null, 2);
        progress.textContent = response.ok ? 'Complete.' : `Request returned HTTP ${response.status}.`;
      } catch (error) {
        resultJson.textContent = 'Could not reach the local application. Check that the server is running.';
        progress.textContent = '';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
